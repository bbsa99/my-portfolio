apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudforge.fullname" . }}-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET_KEY: {{ .Values.global.jwtSecret | b64enc | quote }}
  POSTGRES_USER: {{ .Values.global.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.global.postgresPassword | quote }}
  REDIS_URL: {{ .Values.global.redisUrl | quote }}
  CATALOG_SERVICE_URL: {{ .Values.global.catalogServiceUrl | quote }}
  ORDERS_SERVICE_URL: {{ .Values.global.ordersServiceUrl | quote }}
