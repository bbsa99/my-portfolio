apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudforge-redis
  labels:
    app: cloudforge
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudforge
      component: redis
  template:
    metadata:
      labels:
        app: cloudforge
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
            requests:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodicity: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodicity: 10
            timeoutSeconds: 3
            failureThreshold: 3
