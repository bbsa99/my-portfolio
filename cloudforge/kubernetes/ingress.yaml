apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudforge-gateway-ingress
  namespace: cloudforge
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
spec:
  tls:
    - hosts:
        - api.cloudforge.local
      secretName: cloudforge-gateway-tls
  rules:
    - host: api.cloudforge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudforge-gateway
                port:
                  number: 80
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: cloudforge-catalog
                port:
                  number: 8001
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: cloudforge-orders
                port:
                  number: 8002
