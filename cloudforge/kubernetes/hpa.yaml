apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudforge-gateway-hpa
  namespace: cloudforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudforge-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
    - type: External
      external:
        metric:
          name: request_count
          selector:
            matchLabels:
              app: cloudforge
              component: gateway
        target:
          type: AverageValue
          averageValue: "100"
