[alembic]
script_location = migrations
sqlalchemy.url = postgresql+asyncpg://cloudforge:password@postgres:5432/cloudforge

[loggers]
keys = root,sqlalchemy.alembic,sql engine

[handlers]
keys = console

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)s - %(name)s - %(message)s

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
logger = sqlalchemy.alembic
level = INFO
handlers = console
